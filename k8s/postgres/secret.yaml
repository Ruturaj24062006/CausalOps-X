apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: causalops
  # Production secrets must use proper secret management!
  # These are local-development credentials ONLY.
type: Opaque
stringData:
  POSTGRES_USER: "causalops_user"
  POSTGRES_PASSWORD: "causalops_dev_password"
  POSTGRES_DB: "causalops_db"
