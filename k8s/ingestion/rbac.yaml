apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-ingestion
  namespace: causalops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-ingestion-events
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-ingestion-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: data-ingestion-events
subjects:
  - kind: ServiceAccount
    name: data-ingestion
    namespace: causalops
