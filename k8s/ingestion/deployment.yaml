apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion
  namespace: causalops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-ingestion
  template:
    metadata:
      labels:
        app: data-ingestion
    spec:
      serviceAccountName: data-ingestion
      containers:
        - name: data-ingestion
          image: data-ingestion-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: KAFKA_METRICS_TOPIC
              value: "raw.metrics"
            - name: KAFKA_EVENTS_TOPIC
              value: "raw.events"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
