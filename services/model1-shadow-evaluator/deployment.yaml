apiVersion: apps/v1
kind: Deployment
metadata:
  name: model1-shadow-evaluator
  namespace: causalops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model1-shadow-evaluator
  template:
    metadata:
      labels:
        app: model1-shadow-evaluator
    spec:
      containers:
      - name: evaluator
        image: stream-processing-service:latest
        imagePullPolicy: Never
        command: ["sleep", "3600"]
